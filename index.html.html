    function calcularMuestra(N, H = 0, M = 0) {
      const total = Math.max(1, Math.floor(N));
      if (total <= 50) {
        return { total, hombres: H, mujeres: M, esMuestreo: false };
      }
      const num = 0.9604 * total;
      const den = 0.0025 * (total - 1) + 0.9604;
      const n = Math.ceil(num / den);
      const totalG = H + M;
      let hom = totalG > 0 ? Math.round(n * (H / totalG)) : Math.ceil(n / 2);
      let muj = n - hom;
      return { total: n, hombres: hom, mujeres: muj, esMuestreo: true };
    }

    // ========================================================================
    // 6. MÓDULO AUTOAPLICACIÓN DEL TRABAJADOR (CON SCROLL AL INICIO)
    // ========================================================================
    function VistaTrabajador({ centros, empresas, onRegistrarEvaluacion }) {
      const topRef = useRef(null);
      const [paso, setPaso] = useState(1);
      const [tokenInput, setTokenInput] = useState("");
      const [tokenError, setTokenError] = useState("");
      const [centroSel, setCentroSel] = useState(centros[0]);
      const [aceptoAviso, setAceptoAviso] = useState(false);

      const [fichaV, setFichaV] = useState({
        genero: "M",
        rangoEdad: "30-39",
        departamento: "Operaciones",
        puesto: "Operador de Planta",
        clientes: false,
        subordinados: false
      });

      const [respI, setRespI] = useState({
        s1_1: false, s1_2: false, s1_3: false, s1_4: false, s1_5: false,
        s2_1: false, s2_2: false,
        s3_1: false, s3_2: false, s3_3: false, s3_4: false, s3_5: false, s3_6: false, s3_7: false,
        s4_1: false, s4_2: false, s4_3: false, s4_4: false, s4_5: false
      });

      const [respLikert, setRespLikert] = useState({});
      const [bloqueActual, setBloqueActual] = useState(1);
      const itemsPorBloque = 10;
      const [folioFinal, setFolioFinal] = useState("");

      useEffect(() => {
        if (topRef.current) {
          topRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, [paso, bloqueActual]);

      const handleToken = (e) => {
        e.preventDefault();
        const t = tokenInput.trim().toUpperCase();
        const c = centros.find(item => item.tokenAcceso.toUpperCase() === t || item.codigoCentro.toUpperCase() === t);
        if (c) {
          setCentroSel(c);
          setTokenError("");
          setPaso(2);
        } else {
          setTokenError("Token incorrecto. Verifique con su departamento de Recursos Humanos.");
        }
      };

      const banco = centroSel.tipoGuia === "GUIA_II" ? BANCO_GUIA_II : BANCO_GUIA_III;
      const totalItems = Object.keys(banco).length;
      const totalBloques = Math.ceil(totalItems / itemsPorBloque);
      const itemsEnBloque = Object.entries(banco).slice((bloqueActual - 1) * itemsPorBloque, bloqueActual * itemsPorBloque);

      const handleTerminar = () => {
        const folio = `FOL-${centroSel.codigoCentro}-${Math.floor(10000 + Math.random() * 90000)}`;
        const resATS = evaluarGuiaI(respI);
        
        let score = 0;
        Object.entries(respLikert).forEach(([numStr, val]) => {
          const num = parseInt(numStr);
          score += centroSel.tipoGuia === "GUIA_II" ? puntuarItemGuiaII(num, val) : puntuarItemGuiaIII(num, val);
        });

        const nivel = centroSel.tipoGuia === "GUIA_II" ? clasificarTotalGuiaII(score) : clasificarTotalGuiaIII(score);

        const nuevaEv = {
          id: `ev-${Date.now()}`,
          empresaId: centroSel.empresaId,
          centroId: centroSel.id,
          fecha: new Date().toISOString().split("T")[0],
          folio,
          genero: fichaV.genero,
          departamento: fichaV.departamento,
          puesto: fichaV.puesto,
          scoreTotal: score,
          nivelTotal: nivel,
          atsClinico: resATS.requiere,
          tipoGuia: centroSel.tipoGuia
        };

        onRegistrarEvaluacion(nuevaEv);
        setFolioFinal(folio);
        setPaso(6);
      };

      return (
        <div ref={topRef} className="max-w-3xl mx-auto space-y-6">
          <div className="bg-slate-900 text-white p-4 rounded-lg flex justify-between items-center text-xs">
            <div>
              <span className="font-bold">AUTOAPLICACIÓN OFICIAL NOM-035</span>
              <span className="ml-2 text-slate-400">· Centro: {centroSel.nombreSede}</span>
            </div>
            <div className="font-mono text-emerald-400">Paso {paso} de 6</div>
          </div>

          {/* PASO 1: TOKEN */}
          {paso === 1 && (
            <div className="bg-white p-6 sm:p-8 rounded-lg border border-slate-200 shadow-xs space-y-4">
              <h2 className="text-lg font-bold text-center text-slate-900">Bienvenido a la Evaluación Psicosocial</h2>
              <p className="text-xs text-slate-600 text-center max-w-md mx-auto">
                Ingrese el código o token proporcionado por su centro de trabajo para iniciar la evaluación anónima.
              </p>

              <form onSubmit={handleToken} className="max-w-sm mx-auto space-y-3 pt-2">
                <input
                  type="text"
                  placeholder="Ej. BAJIO-NV1-2024"
                  value={tokenInput}
                  onChange={(e) => setTokenInput(e.target.value)}
                  className="w-full text-center font-mono uppercase text-sm border rounded py-2"
                />
                {tokenError && <p className="text-xs text-red-600">{tokenError}</p>}
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2.5 rounded">
                  Validar Token y Comenzar
                </button>
              </form>

              <div className="border-t pt-4 text-center">
                <span className="text-[11px] text-slate-400 block mb-2">O seleccione directamente un centro de demostración:</span>
                <div className="flex gap-2 justify-center flex-wrap">
                  {centros.map(c => (
                    <button
                      key={c.id}
                      onClick={() => { setCentroSel(c); setPaso(2); }}
                      className="text-xs bg-slate-50 border hover:bg-slate-100 px-3 py-1.5 rounded text-slate-700"
                    >
                      {c.nombreSede} ({c.tokenAcceso})
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* PASO 2: AVISO PRIVACIDAD */}
          {paso === 2 && (
            <div className="bg-white p-6 sm:p-8 rounded-lg border border-slate-200 shadow-xs space-y-4">
              <h2 className="text-base font-bold text-slate-900">Aviso de Privacidad y Confidencialidad Obligatoria</h2>
              <div className="bg-slate-50 p-4 rounded text-xs text-slate-700 space-y-2 max-h-60 overflow-y-auto leading-relaxed border">
                <p><strong>1. Confidencialidad:</strong> Sus respuestas son 100% anónimas. En ningún momento se recopila nombre ni número de empleado.</p>
                <p><strong>2. Objetivo de la norma:</strong> Identificar y analizar factores de riesgo psicosocial en el trabajo y prevenir daños a la salud.</p>
                <p><strong>3. Cero Represalias:</strong> La información no podrá ser utilizada en su perjuicio bajo ninguna circunstancia.</p>
              </div>

              <label className="flex items-center gap-2 p-3 bg-emerald-50 border border-emerald-200 rounded cursor-pointer text-xs text-emerald-950 font-medium">
                <input
                  type="checkbox"
                  checked={aceptoAviso}
                  onChange={(e) => setAceptoAviso(e.target.checked)}
                  className="h-4 w-4 accent-emerald-600"
                />
                <span>Acepto participar libre y voluntariamente bajo las garantías de confidencialidad de la NOM-035.</span>
              </label>

              <div className="flex justify-between pt-2">
                <button onClick={() => setPaso(1)} className="text-xs text-slate-600">Atrás</button>
                <button
                  disabled={!aceptoAviso}
                  onClick={() => setPaso(3)}
                  className={`text-xs px-4 py-2 rounded font-semibold ${aceptoAviso ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-400 cursor-not-allowed"}`}
                >
                  Continuar a Ficha Demográfica
                </button>
              </div>
            </div>
          )}

          {/* PASO 3: FICHA GUÍA V */}
          {paso === 3 && (
            <div className="bg-white p-6 sm:p-8 rounded-lg border border-slate-200 shadow-xs space-y-4">
              <h2 className="text-base font-bold text-slate-900">Ficha Sociodemográfica del Trabajador (Guía V)</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div>
                  <label className="block text-slate-700 font-medium">Género:</label>
                  <select
                    value={fichaV.genero}
                    onChange={(e) => setFichaV({ ...fichaV, genero: e.target.value })}
                    className="w-full border rounded p-1.5 mt-1"
                  >
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-700 font-medium">Rango de Edad:</label>
                  <select
                    value={fichaV.rangoEdad}
                    onChange={(e) => setFichaV({ ...fichaV, rangoEdad: e.target.value })}
                    className="w-full border rounded p-1.5 mt-1"
                  >
                    <option value="20-29">20 a 29 años</option>
                    <option value="30-39">30 a 39 años</option>
                    <option value="40-49">40 a 49 años</option>
                    <option value="50-MAS">50 o más</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-700 font-medium">Departamento / Área:</label>
                  <input
                    type="text"
                    value={fichaV.departamento}
                    onChange={(e) => setFichaV({ ...fichaV, departamento: e.target.value })}
                    className="w-full border rounded p-1.5 mt-1"
                  />
                </div>
                <div>
                  <label className="block text-slate-700 font-medium">Puesto:</label>
                  <input
                    type="text"
                    value={fichaV.puesto}
                    onChange={(e) => setFichaV({ ...fichaV, puesto: e.target.value })}
                    className="w-full border rounded p-1.5 mt-1"
                  />
                </div>
              </div>

              <div className="flex justify-between pt-4 border-t">
                <button onClick={() => setPaso(2)} className="text-xs text-slate-600">Atrás</button>
                <button onClick={() => setPaso(4)} className="text-xs bg-emerald-600 text-white font-semibold px-4 py-2 rounded">
                  Avanzar a Guía I (ATS)
                </button>
              </div>
            </div>
          )}

          {/* PASO 4: GUÍA I ATS */}
          {paso === 4 && (
            <div className="bg-white p-6 sm:p-8 rounded-lg border border-slate-200 shadow-xs space-y-4">
              <h2 className="text-base font-bold text-slate-900">Guía I: Acontecimientos Traumáticos Severos</h2>
              <p className="text-xs text-slate-600">
                ¿Ha presenciado o sufrido alguna vez durante su trabajo accidentes graves, asaltos con violencia o amenazas directas contra su vida?
              </p>

              <div className="space-y-2 text-xs">
                {[
                  { k: "s1_1", t: "¿Ha presenciado o sufrido accidentes graves con riesgo de muerte o mutilación?" },
                  { k: "s1_2", t: "¿Ha sufrido asaltos con violencia o uso de armas dentro de su trabajo?" },
                  { k: "s1_3", t: "¿Ha sufrido privación de la libertad o amenazas directas contra su vida?" }
                ].map(item => (
                  <div key={item.k} className="p-3 bg-slate-50 border rounded flex justify-between items-center">
                    <span className="pr-2">{item.t}</span>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setRespI({ ...respI, [item.k]: true })}
                        className={`px-3 py-1 rounded font-bold text-xs ${respI[item.k] ? "bg-red-600 text-white" : "bg-white border text-slate-700"}`}
                      >
                        SÍ
                      </button>
                      <button
                        type="button"
                        onClick={() => setRespI({ ...respI, [item.k]: false })}
                        className={`px-3 py-1 rounded font-bold text-xs ${!respI[item.k] ? "bg-slate-700 text-white" : "bg-white border text-slate-700"}`}
                      >
                        NO
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex justify-between pt-4 border-t">
                <button onClick={() => setPaso(3)} className="text-xs text-slate-600">Atrás</button>
                <button onClick={() => setPaso(5)} className="text-xs bg-emerald-600 text-white font-semibold px-4 py-2 rounded">
                  Avanzar al Cuestionario Principal ({centroSel.tipoGuia})
                </button>
              </div>
            </div>
          )}

          {/* PASO 5: CUESTIONARIO LIKERT (CON SCROLL TOP EN CADA BLOQUE) */}
          {paso === 5 && (
            <div className="bg-white p-6 sm:p-8 rounded-lg border border-slate-200 shadow-xs space-y-5">
              <div className="flex justify-between items-center border-b pb-3">
                <h2 className="text-sm font-bold text-slate-900">
                  {centroSel.tipoGuia} · Bloque {bloqueActual} de {totalBloques}
                </h2>
                <span className="text-xs text-slate-500 font-mono">
                  Respondidos: {Object.keys(respLikert).length} / {totalItems}
                </span>
              </div>

              <div className="space-y-4">
                {itemsEnBloque.map(([numStr, texto]) => {
                  const num = parseInt(numStr);
                  const sel = respLikert[num];

                  return (
                    <div key={num} className="p-3.5 bg-slate-50 border rounded-lg space-y-2">
                      <p className="text-xs font-semibold text-slate-800">
                        <span className="font-mono text-slate-400 mr-1.5">#{num}</span> {texto}
                      </p>
                      <div className="grid grid-cols-2 sm:grid-cols-5 gap-1.5 pt-1">
                        {LIKERT_OPCIONES.map(op => (
                          <button
                            key={op.val}
                            type="button"
                            onClick={() => setRespLikert({ ...respLikert, [num]: op.val })}
                            className={`py-1.5 text-xs rounded border text-center transition font-medium ${
                              sel === op.val
                                ? "bg-emerald-600 text-white border-emerald-600 font-bold"
                                : "bg-white text-slate-700 hover:bg-slate-100"
                            }`}
                          >
                            {op.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flex justify-between items-center pt-4 border-t">
                <button
                  onClick={() => {
                    if (bloqueActual > 1) setBloqueActual(bloqueActual - 1);
                    else setPaso(4);
                  }}
                  className="text-xs text-slate-600"
                >
                  {bloqueActual > 1 ? "Bloque Anterior" : "Volver a Guía I"}
                </button>

                {bloqueActual < totalBloques ? (
                  <button
                    onClick={() => setBloqueActual(bloqueActual + 1)}
                    className="text-xs bg-slate-900 text-white font-semibold px-4 py-2 rounded"
                  >
                    Siguiente Bloque
                  </button>
                ) : (
                  <button
                    onClick={handleTerminar}
                    className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded"
                  >
                    Finalizar y Enviar Evaluación
                  </button>
                )}
              </div>
            </div>
          )}

          {/* PASO 6: FINAL */}
          {paso === 6 && (
            <div className="bg-white p-8 rounded-lg border border-slate-200 shadow-xs text-center space-y-4">
              <div className="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                ✓
              </div>
              <h2 className="text-xl font-bold text-slate-900">¡Evaluación Completada con Éxito!</h2>
              <p className="text-xs text-slate-600 max-w-md mx-auto">
                Sus respuestas han sido procesadas de forma estrictamente confidencial bajo la NOM-035-STPS-2018.
              </p>
              <div className="p-3 bg-slate-50 border rounded max-w-xs mx-auto text-xs">
                <span className="text-slate-500 block text-[11px]">Folio de Comprobante:</span>
                <span className="font-mono font-bold text-sm text-slate-900">{folioFinal}</span>
              </div>
              <button
                onClick={() => { setPaso(1); setRespLikert({}); setBloqueActual(1); }}
                className="text-xs bg-slate-900 text-white px-4 py-2 rounded"
              >
                Iniciar Otra Aplicación
              </button>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // 7. MÓDULO BUZÓN CONFIDENCIAL (NUMERAL 8.1 INCISO B)
    // ========================================================================
    function VistaBuzon({ empresas, centros, quejas, onRegistrarQueja }) {
      const [folioGenerado, setFolioGenerado] = useState("");
      const [tipo, setTipo] = useState("VIOLENCIA_LABORAL");
      const [area, setArea] = useState("");
      const [desc, setDesc] = useState("");

      const handleEnviar = (e) => {
        e.preventDefault();
        const folio = `FOL-QJ-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}-BZ`;
        const q = {
          id: `qj-${Date.now()}`,
          empresaId: empresas[0].id,
          folio,
          fecha: new Date().toISOString().split("T")[0],
          tipo,
          area,
          desc,
          estatus: "RECIBIDA",
          accion: "Registrada en el buzón confidencial para investigación por el Comité."
        };
        onRegistrarQueja(q);
        setFolioGenerado(folio);
        setArea("");
        setDesc("");
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-xs space-y-4">
            <h2 className="text-base font-bold text-slate-900">Buzón Confidencial de Quejas y Violencia Laboral</h2>
            <p className="text-xs text-slate-500">
              Mecanismo seguro bajo el numeral 8.1 inciso b) para reportar prácticas opuestas al entorno favorable.
            </p>

            {folioGenerado ? (
              <div className="p-4 bg-emerald-50 border border-emerald-200 rounded text-center space-y-2 text-xs">
                <span className="font-bold text-emerald-800 text-sm block">¡Reporte Enviado con Cifrado Anónimo!</span>
                <span className="text-slate-600 block">Conserve su folio para consultar el seguimiento:</span>
                <span className="font-mono font-bold bg-white px-3 py-1 rounded border text-sm">{folioGenerado}</span>
                <button onClick={() => setFolioGenerado("")} className="block mx-auto text-emerald-700 underline pt-2">
                  Enviar otro reporte
                </button>
              </div>
            ) : (
              <form onSubmit={handleEnviar} className="space-y-3 text-xs">
                <div>
                  <label className="block text-slate-700 font-medium">Tipo de Conducta:</label>
                  <select
                    value={tipo}
                    onChange={(e) => setTipo(e.target.value)}
                    className="w-full border rounded p-1.5 mt-1"
                  >
                    <option value="VIOLENCIA_LABORAL">Violencia Laboral (Agresión física, verbal o psicológica)</option>
                    <option value="HOSTIGAMIENTO">Hostigamiento o Acoso Laboral</option>
                    <option value="PRACTICA_OPUESTA">Práctica Opuesta al Entorno Organizacional</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-700 font-medium">Área o Turno donde ocurrieron los hechos:</label>
                  <input
                    required
                    type="text"
                    value={area}
                    onChange={(e) => setArea(e.target.value)}
                    placeholder="Ej. Línea 2 Ensamble, Turno Nocturno"
                    className="w-full border rounded p-1.5 mt-1"
                  />
                </div>
                <div>
                  <label className="block text-slate-700 font-medium">Descripción de los hechos:</label>
                  <textarea
                    required
                    rows="3"
                    value={desc}
                    onChange={(e) => setDesc(e.target.value)}
                    placeholder="Describa la situación sin proporcionar datos que vulneren su anonimato..."
                    className="w-full border rounded p-1.5 mt-1"
                  />
                </div>
                <button type="submit" className="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-4 py-2 rounded">
                  Enviar Reporte Anónimo
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // 8. MÓDULO REPORTE NORMATIVO OFICIAL (NUMERAL 7.7 STPS)
    // ========================================================================
    function VistaReporteOficial77({ empresa, centro, centros, setCentroId, evaluaciones, evaluador, setEvaluador }) {
      const canalizados = evaluaciones.filter(e => e.atsClinico).length;
      const totalScore = evaluaciones.reduce((sum, e) => sum + e.scoreTotal, 0);
      const promedio = evaluaciones.length > 0 ? Math.round((totalScore / evaluaciones.length) * 10) / 10 : 0;
      const nivelGlobal = centro.tipoGuia === "GUIA_II" ? clasificarTotalGuiaII(promedio) : clasificarTotalGuiaIII(promedio);

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-4 rounded-lg border shadow-xs flex justify-between items-center no-print">
            <div>
              <h2 className="text-sm font-bold text-slate-900">Emisor de Informe Normativo (Numeral 7.7)</h2>
              <p className="text-xs text-slate-500">Documento membretado para presentación ante inspectores de la STPS.</p>
            </div>
            <div className="flex gap-2">
              <select
                value={centro.id}
                onChange={(e) => setCentroId(e.target.value)}
                className="text-xs border rounded px-2 py-1"
              >
                {centros.map(c => <option key={c.id} value={c.id}>{c.nombreSede}</option>)}
              </select>
              <button
                onClick={() => window.print()}
                className="bg-slate-900 text-white text-xs px-4 py-1.5 rounded font-bold"
              >
                Imprimir / PDF
              </button>
            </div>
          </div>

          {/* INFORME IMPRIMIBLE */}
          <div className="bg-white p-8 sm:p-12 rounded-lg border shadow-sm space-y-6 text-xs print-full">
            <div className="border-b-2 border-slate-900 pb-4">
              <span className="font-mono font-bold text-[10px] text-slate-500 uppercase">
                ESTADOS UNIDOS MEXICANOS · SECRETARÍA DEL TRABAJO Y PREVISIÓN SOCIAL
              </span>
              <h1 className="text-base font-extrabold text-slate-900 mt-1">
                INFORME DE EVALUACIÓN DE FACTORES DE RIESGO PSICOSOCIAL Y ENTORNO ORGANIZACIONAL
              </h1>
              <span className="text-[11px] text-slate-600 block">Cumplimiento del Numeral 7.7 de la Norma Oficial Mexicana NOM-035-STPS-2018</span>
            </div>

            <section className="space-y-2">
              <h3 className="font-bold bg-slate-100 p-1.5 border-l-4 border-slate-900 uppercase">
                1. Datos del Centro de Trabajo (Numeral 7.7 incisos a y b)
              </h3>
              <div className="grid grid-cols-2 gap-2 text-[11px]">
                <div>Razón Social: <strong>{empresa.razonSocial}</strong></div>
                <div>R.F.C.: <strong>{empresa.rfc}</strong></div>
                <div>Centro Evaluado: <strong>{centro.nombreSede}</strong></div>
                <div>Plantilla Total: <strong>{centro.plantillaTotal} trabajadores</strong></div>
                <div className="col-span-2">Actividad Principal: {empresa.actividadPrincipal}</div>
              </div>
            </section>

            <section className="space-y-2">
              <h3 className="font-bold bg-slate-100 p-1.5 border-l-4 border-slate-900 uppercase">
                2. Método Psicométrico y Representatividad (Numeral 7.7 incisos c y d)
              </h3>
              <p className="text-[11px] leading-relaxed">
                Se aplicó la <strong>{centro.tipoGuia} oficial</strong> junto con la Guía de Referencia I (Acontecimientos Traumáticos Severos). Cuestionarios evaluados: <strong>{evaluaciones.length}</strong> sobre una meta muestral de <strong>{centro.muestraCalculada}</strong>.
              </p>
            </section>

            <section className="space-y-2">
              <h3 className="font-bold bg-slate-100 p-1.5 border-l-4 border-slate-900 uppercase">
                3. Resultados Consolidados (Numeral 7.7 inciso e)
              </h3>
              <div className="p-3 border rounded flex justify-between items-center" style={{ borderColor: ESCALA_COLORES[nivelGlobal].color }}>
                <div>
                  <span className="text-slate-600 block">Puntaje Promedio General:</span>
                  <span className="text-xl font-bold">{promedio} puntos</span>
                </div>
                <span className={`text-xs font-bold px-3 py-1 rounded border ${ESCALA_COLORES[nivelGlobal].badge}`}>
                  NIVEL DE RIESGO: {nivelGlobal}
                </span>
              </div>
              <p className="text-[11px] text-slate-700">
                Trabajadores canalizados a valoración médica clínica (Guía I ATS): <strong>{canalizados}</strong>.
              </p>
            </section>

            <section className="space-y-2">
              <h3 className="font-bold bg-slate-100 p-1.5 border-l-4 border-slate-900 uppercase">
                4. Conclusiones y Medidas de Intervención por Niveles (8.4 y 8.5)
              </h3>
              <div className="space-y-1.5 text-[11px]">
                <div className="p-2 bg-slate-50 border rounded">
                  <strong>Nivel 1 (Organizacional):</strong> Actualizar política de prevención y regular tiempos de descanso y desconexión digital.
                </div>
                <div className="p-2 bg-slate-50 border rounded">
                  <strong>Nivel 2 (Grupal):</strong> Talleres de sensibilización sobre liderazgo positivo y erradicación de violencia laboral.
                </div>
                <div className="p-2 bg-slate-50 border rounded">
                  <strong>Nivel 3 (Individual):</strong> Canalización médica y psicológica confidencial al IMSS de colaboradores con afectación severa.
                </div>
              </div>
            </section>

            <section className="space-y-4 pt-4 border-t">
              <h3 className="font-bold uppercase">5. Datos del Evaluador Profesional (Numeral 7.7 inciso g)</h3>
              <div className="text-[11px] space-y-0.5">
                <div>Nombre: <strong>{evaluador.nombre}</strong></div>
                <div>Cédula Profesional: <strong>{evaluador.cedula}</strong></div>
                <div>Especialidad: {evaluador.profesion}</div>
              </div>

              <div className="grid grid-cols-2 gap-6 pt-6 text-center text-[10px]">
                <div className="border-t pt-2">
                  <strong>{evaluador.nombre}</strong>
                  <span className="block text-slate-500">Céd. {evaluador.cedula} · Consultor SST</span>
                </div>
                <div className="border-t pt-2">
                  <strong>{empresa.contactoNombre}</strong>
                  <span className="block text-slate-500">Representante Legal · {empresa.razonSocial}</span>
                </div>
              </div>
            </section>
          </div>
        </div>
      );
    }

    // Renderizado en el elemento raíz
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
